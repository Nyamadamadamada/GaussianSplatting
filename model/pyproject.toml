[project]
name = "model"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "nerfstudio==1.1.5",
]

[tool.uv]
# ローカルのCOLMAP処理はApple Silicon Macでのみ行うため、解決対象を限定する
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
# nerfstudioがarm64向けに要求するnewrawpyはベータ版しか公開されていないため許可する
prerelease = "allow"
